<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">Terragrunt three-account architecture</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#55e6c1"/></marker><style>text{font-family:Arial;fill:#dce9f4}.b{fill:#0b1929;stroke:#3a5670;stroke-width:2}.g{fill:#123744;stroke:#55e6c1;stroke-width:2}.l{stroke:#55e6c1;stroke-width:2;fill:none;marker-end:url(#a)}.s{font-size:13px;fill:#9fb1c4}.h{font-size:15px;font-weight:bold}</style></defs><rect width="1200" height="600" fill="#07111f"/><text x="40" y="42" font-size="25" font-weight="bold">Terragrunt multi-account deployment</text>
<rect x="40" y="90" width="250" height="75" rx="9" class="g"/><text x="165" y="120" text-anchor="middle" class="h">One Terraform module</text><text x="165" y="143" text-anchor="middle" class="s">ecs-fargate-webapp</text><rect x="40" y="220" width="250" height="75" rx="9" class="b"/><text x="165" y="250" text-anchor="middle" class="h">Terragrunt root.hcl</text><text x="165" y="273" text-anchor="middle" class="s">provider · backend · common inputs</text><path d="M165 165V220" class="l"/>
<rect x="370" y="70" width="240" height="110" rx="10" class="b"/><text x="490" y="102" text-anchor="middle" class="h">Live: account-1</text><text x="490" y="126" text-anchor="middle" class="s">OIDC role 1 · SSM pair 1</text><text x="490" y="150" text-anchor="middle" class="s">Independent ECS deployment</text><rect x="370" y="225" width="240" height="110" rx="10" class="b"/><text x="490" y="257" text-anchor="middle" class="h">Live: account-2</text><text x="490" y="281" text-anchor="middle" class="s">OIDC role 2 · SSM pair 2</text><text x="490" y="305" text-anchor="middle" class="s">Independent ECS deployment</text><rect x="370" y="380" width="240" height="110" rx="10" class="b"/><text x="490" y="412" text-anchor="middle" class="h">Live: account-3</text><text x="490" y="436" text-anchor="middle" class="s">OIDC role 3 · SSM pair 3</text><text x="490" y="460" text-anchor="middle" class="s">Independent ECS deployment</text><path d="M290 257H330V125H370M330 280H370M330 435H370" class="l"/>
<rect x="720" y="115" width="400" height="330" rx="12" class="g"/><text x="920" y="151" text-anchor="middle" class="h">Shared encrypted S3 backend</text><text x="920" y="177" text-anchor="middle" class="s">Native S3 lock file · KMS · versioning</text><rect x="760" y="215" width="320" height="55" rx="8" class="b"/><text x="920" y="248" text-anchor="middle" class="s">&lt;project&gt;/account-1/app/terraform.tfstate</text><rect x="760" y="295" width="320" height="55" rx="8" class="b"/><text x="920" y="328" text-anchor="middle" class="s">&lt;project&gt;/account-2/app/terraform.tfstate</text><rect x="760" y="375" width="320" height="55" rx="8" class="b"/><text x="920" y="408" text-anchor="middle" class="s">&lt;project&gt;/account-3/app/terraform.tfstate</text><path d="M610 125H690V242H760M610 280H690V322H760M610 435H690V402H760" class="l"/><text x="40" y="560" class="s">Legend: each live configuration has distinct credentials, SSM parameters, state key, VPC, ALB, cluster, and services; only module code and backend infrastructure are shared.</text></svg>
