<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t"><title id="t">Frontend and API request flow</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#55e6c1"/></marker><style>text{font-family:Arial;fill:#dce9f4}.b{fill:#0b1929;stroke:#3a5670;stroke-width:2}.g{fill:#123744;stroke:#55e6c1;stroke-width:2}.l{stroke:#55e6c1;stroke-width:2;fill:none;marker-end:url(#a)}.s{font-size:13px;fill:#9fb1c4}.h{font-size:16px;font-weight:bold}</style></defs><rect width="1200" height="480" fill="#07111f"/><text x="40" y="45" font-size="25" font-weight="bold">Same-origin request flow</text>
<rect x="40" y="90" width="150" height="60" rx="9" class="g"/><text x="115" y="126" text-anchor="middle" class="h">User / React</text><rect x="250" y="90" width="190" height="60" rx="9" class="b"/><text x="345" y="116" text-anchor="middle" class="h">Public DNS + ALB</text><text x="345" y="137" text-anchor="middle" class="s">HTTP listener · ALB SG</text><path d="M190 120H250" class="l"/>
