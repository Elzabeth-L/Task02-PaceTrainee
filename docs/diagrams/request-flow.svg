<path d="M440 120H805V235" class="l"/><text x="580" y="105" class="s">/api/info</text><rect x="805" y="180" width="250" height="90" rx="9" class="g"/><text x="930" y="210" text-anchor="middle" class="h">Backend target group (ip)</text><text x="930" y="233" text-anchor="middle" class="s">Task ENI + backend SG</text><text x="930" y="253" text-anchor="middle" class="s">FastAPI → JSON response</text>
