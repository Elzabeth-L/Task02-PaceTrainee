<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t"><title id="t">Two GitHub Actions workflows</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#55e6c1"/></marker><style>text{font-family:Arial;fill:#dce9f4}.b{fill:#0b1929;stroke:#3a5670;stroke-width:2}.g{fill:#123744;stroke:#55e6c1;stroke-width:2}.l{stroke:#55e6c1;stroke-width:2;fill:none;marker-end:url(#a)}.s{font-size:13px;fill:#9fb1c4}.h{font-size:15px;font-weight:bold}</style></defs><rect width="1200" height="620" fill="#07111f"/><text x="40" y="42" font-size="25" font-weight="bold">One branch · two workflows · three accounts</text>
<rect x="45" y="85" width="145" height="60" rx="8" class="g"/><text x="117" y="120" text-anchor="middle" class="h">main branch</text><rect x="245" y="70" width="260" height="90" rx="9" class="b"/><text x="375" y="101" text-anchor="middle" class="h">build-images.yml</text><text x="375" y="124" text-anchor="middle" class="s">test · build · scan · smoke</text><text x="375" y="144" text-anchor="middle" class="s">full commit SHA only</text><path d="M190 115H245" class="l"/>
<rect x="570" y="70" width="250" height="90" rx="9" class="g"/><text x="695" y="101" text-anchor="middle" class="h">Public GHCR</text><text x="695" y="124" text-anchor="middle" class="s">frontend:&lt;SHA&gt;</text><text x="695" y="144" text-anchor="middle" class="s">backend:&lt;SHA&gt;</text><path d="M505 115H570" class="l"/>
<rect x="245" y="235" width="260" height="100" rx="9" class="b"/><text x="375" y="268" text-anchor="middle" class="h">infrastructure.yml</text><text x="375" y="291" text-anchor="middle" class="s">plan · apply · destroy</text><text x="375" y="313" text-anchor="middle" class="s">operator supplies deployment SHA</text><path d="M117 145V285H245" class="l"/><path d="M695 160V210H505V250" class="l"/>
<rect x="570" y="225" width="250" height="60" rx="9" class="g"/><text x="695" y="260" text-anchor="middle" class="h">GitHub OIDC → AWS role</text><rect x="570" y="310" width="250" height="60" rx="9" class="b"/><text x="695" y="345" text-anchor="middle" class="h">Two SSM URI updates</text><rect x="570" y="395" width="250" height="60" rx="9" class="b"/><text x="695" y="430" text-anchor="middle" class="h">Binary plan + checksum</text><rect x="570" y="480" width="250" height="60" rx="9" class="g"/><text x="695" y="515" text-anchor="middle" class="h">Protected approval → exact apply</text><path d="M505 285H570M695 285V310M695 370V395M695 455V480" class="l"/>
<rect x="900" y="210" width="245" height="345" rx="12" class="b"/><text x="1022" y="245" text-anchor="middle" class="h">Deployment targets</text><rect x="930" y="275" width="185" height="60" rx="8" class="g"/><text x="1022" y="311" text-anchor="middle" class="h">AWS account 1</text><rect x="930" y="365" width="185" height="60" rx="8" class="g"/><text x="1022" y="401" text-anchor="middle" class="h">AWS account 2</text><rect x="930" y="455" width="185" height="60" rx="8" class="g"/><text x="1022" y="491" text-anchor="middle" class="h">AWS account 3</text><path d="M820 510H870V305H930M870 395H930M870 485H930" class="l"/>
<text x="45" y="590" class="s">Legend: green borders mark trust/approval boundaries. Plan-only runs never mutate infrastructure or SSM.</text></svg>
