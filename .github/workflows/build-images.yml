name: Build immutable images

on:
  push:
    branches: [main]
    paths:
      - app/frontend/**
      - app/backend/**
      - scripts/images/**
      - scripts/smoke-test.sh
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    env:
      GHCR_REPOSITORY_PREFIX: ${{ vars.GHCR_REPOSITORY_PREFIX || github.event.repository.name }}
      APP_VERSION: 1.0.0
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture immutable build metadata
        id: meta
        run: bash scripts/images/capture-metadata.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Validate frontend
        run: bash scripts/images/validate-frontend.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.1'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Validate backend
        run: bash scripts/images/validate-backend.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/frontend/Dockerfile
          failure-threshold: warning

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/backend/Dockerfile
          failure-threshold: warning

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke-test both containers
        run: bash scripts/images/smoke-containers.sh

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images and create deployment metadata
        env:
          BUILD_CREATED_AT: ${{ steps.meta.outputs.created }}
        run: bash scripts/images/publish-metadata.sh

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata-${{ github.sha }}
          path: image-metadata.json
          retention-days: 30
          if-no-files-found: error
