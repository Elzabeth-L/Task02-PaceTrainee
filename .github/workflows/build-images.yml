name: Build immutable images

on:
  push:
    branches: [main]
    paths:
      - app/frontend/**
      - app/backend/**
      - scripts/build-images.sh
      - scripts/smoke-test.sh
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    env:
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.GHCR_REPOSITORY_PREFIX || github.event.repository.name }}-frontend
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.GHCR_REPOSITORY_PREFIX || github.event.repository.name }}-backend
      APP_VERSION: 1.0.0
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture immutable build metadata
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Validate frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.1'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - name: Validate backend
        working-directory: app/backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          ruff check .
          ruff format --check .
          mypy app
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/frontend/Dockerfile
          failure-threshold: warning
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/backend/Dockerfile
          failure-threshold: warning
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke-test both containers
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() { docker rm -f smoke-frontend smoke-backend >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name smoke-frontend -p 8080:8080 --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run --cap-drop ALL "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker run -d --name smoke-backend -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL "$BACKEND_IMAGE:$GITHUB_SHA"
          bash scripts/smoke-test.sh

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable images
        run: |
          set -Eeuo pipefail
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
      - name: Verify publication and capture digests
        id: digest
        run: |
          set -Eeuo pipefail
          frontend_digest="$(docker buildx imagetools inspect "$FRONTEND_IMAGE:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          backend_digest="$(docker buildx imagetools inspect "$BACKEND_IMAGE:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$frontend_digest"
          test -n "$backend_digest"
          echo "frontend=$frontend_digest" >> "$GITHUB_OUTPUT"
          echo "backend=$backend_digest" >> "$GITHUB_OUTPUT"
      - name: Create deployment metadata
        run: |
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg frontend_image_uri "$FRONTEND_IMAGE:$GITHUB_SHA" \
            --arg frontend_digest "${{ steps.digest.outputs.frontend }}" \
            --arg backend_image_uri "$BACKEND_IMAGE:$GITHUB_SHA" \
            --arg backend_digest "${{ steps.digest.outputs.backend }}" \
            '{source_sha:$source_sha,frontend_image_uri:$frontend_image_uri,frontend_digest:$frontend_digest,backend_image_uri:$backend_image_uri,backend_digest:$backend_digest}' > image-metadata.json
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata-${{ github.sha }}
          path: image-metadata.json
          retention-days: 30
          if-no-files-found: error
      - name: Write build summary
        run: |
          {
            echo '## Immutable images published'
            echo ''
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source commit | \`$GITHUB_SHA\` |"
            echo "| Frontend | \`$FRONTEND_IMAGE:$GITHUB_SHA\` |"
            echo "| Frontend digest | \`${{ steps.digest.outputs.frontend }}\` |"
            echo "| Backend | \`$BACKEND_IMAGE:$GITHUB_SHA\` |"
            echo "| Backend digest | \`${{ steps.digest.outputs.backend }}\` |"
            echo "| Built at | \`${{ steps.meta.outputs.created }}\` |"
            echo "| Workflow run | \`$GITHUB_RUN_ID\` |"
            echo ''
            echo "Supply \`$GITHUB_SHA\` as **image_sha** to the infrastructure workflow."
            echo ''
            echo '> After the first publication, an owner must configure both GHCR packages as public in GitHub package settings.'
          } >> "$GITHUB_STEP_SUMMARY"
