name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to execute
        type: choice
        options: [plan, apply, destroy]
        required: true
      target_account:
        description: Target one account or all three
        type: choice
        options: [account-1, account-2, account-3, all]
        required: true
      image_sha:
        description: Optional image SHA override; blank uses latest successful main image build
        type: string
        required: false
      destroy_confirmation:
        description: Type DESTROY account-1/account-2/account-3/all for destroy
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: 'true'
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.12.2' }}
  TERRAGRUNT_VERSION: ${{ vars.TERRAGRUNT_VERSION || '1.1.1' }}
  TG_PROJECT_NAME: ${{ vars.PROJECT_NAME || 'platform-launchpad' }}
  TG_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TG_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
  GHCR_REPOSITORY_PREFIX: ${{ vars.GHCR_REPOSITORY_PREFIX || github.event.repository.name }}
  AWS_ACCOUNT_ID_ACCOUNT_1: ${{ vars.AWS_ACCOUNT_ID_ACCOUNT_1 }}
  AWS_ACCOUNT_ID_ACCOUNT_2: ${{ vars.AWS_ACCOUNT_ID_ACCOUNT_2 }}
  AWS_ACCOUNT_ID_ACCOUNT_3: ${{ vars.AWS_ACCOUNT_ID_ACCOUNT_3 }}
  AWS_ROLE_ARN_ACCOUNT_1: ${{ vars.AWS_ROLE_ARN_ACCOUNT_1 }}
  AWS_ROLE_ARN_ACCOUNT_2: ${{ vars.AWS_ROLE_ARN_ACCOUNT_2 }}
  AWS_ROLE_ARN_ACCOUNT_3: ${{ vars.AWS_ROLE_ARN_ACCOUNT_3 }}
  AWS_REGION_ACCOUNT_1: ${{ vars.AWS_REGION_ACCOUNT_1 }}
  AWS_REGION_ACCOUNT_2: ${{ vars.AWS_REGION_ACCOUNT_2 }}
  AWS_REGION_ACCOUNT_3: ${{ vars.AWS_REGION_ACCOUNT_3 }}

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    outputs:
      accounts: ${{ steps.validate.outputs.accounts }}
      image_sha: ${{ steps.validate.outputs.image_sha }}
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release and validate inputs
        id: validate
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_ACCOUNT: ${{ inputs.target_account }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          DESTROY_CONFIRMATION: ${{ inputs.destroy_confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/infrastructure/validate-inputs.sh

  create-plan:
    needs: validate-inputs
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.validate-inputs.outputs.accounts) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: infrastructure-${{ matrix.account }}
      cancel-in-progress: false
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up tooling and authenticate to AWS
        id: setup
        uses: ./.github/actions/setup-infrastructure
        with:
          target-account: ${{ matrix.account }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}
          role-session-name: gha-${{ github.run_id }}-${{ matrix.account }}-plan

      - name: Verify public GHCR images
        if: inputs.operation == 'apply'
        env:
          IMAGE_SHA: ${{ needs.validate-inputs.outputs.image_sha }}
        run: bash scripts/infrastructure/verify-images.sh

      - name: Capture current SSM image references
        env:
          ACCOUNT_ALIAS: ${{ matrix.account }}
          REQUIRE_EXISTING: ${{ inputs.operation == 'plan' }}
        run: bash scripts/infrastructure/image-parameters.sh capture "$RUNNER_TEMP/previous-ssm.json"

      - name: Set SSM references for requested release
        if: inputs.operation == 'apply'
        id: ssm_update
        env:
          IMAGE_SHA: ${{ needs.validate-inputs.outputs.image_sha }}
          ACCOUNT_ALIAS: ${{ matrix.account }}
        run: bash scripts/infrastructure/image-parameters.sh set

      - name: Restore SSM references after a partial update
        if: failure() && inputs.operation == 'apply' && steps.ssm_update.outcome == 'failure'
        env:
          ACCOUNT_ALIAS: ${{ matrix.account }}
        run: bash scripts/infrastructure/image-parameters.sh restore "$RUNNER_TEMP/previous-ssm.json"

      - name: Initialize and create exact binary plan
        working-directory: ${{ steps.setup.outputs.live_dir }}
        env:
          OPERATION: ${{ inputs.operation }}
          ACCOUNT_ALIAS: ${{ matrix.account }}
        run: bash "$GITHUB_WORKSPACE/scripts/infrastructure/create-plan.sh"

      - name: Upload reviewed plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.operation }}-${{ matrix.account }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewed.tfplan
            ${{ runner.temp }}/reviewed.tfplan.sha256
            ${{ runner.temp }}/reviewed-plan.txt
            ${{ runner.temp }}/previous-ssm-artifact.json
          retention-days: 5
          if-no-files-found: error

      - name: Summarize plan
        env:
          OPERATION: ${{ inputs.operation }}
          ACCOUNT_ALIAS: ${{ matrix.account }}
          IMAGE_SHA: ${{ needs.validate-inputs.outputs.image_sha }}
        run: bash scripts/infrastructure/summarize.sh

  execute-reviewed-plan:
    if: inputs.operation != 'plan'
    needs: [validate-inputs, create-plan]
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.validate-inputs.outputs.accounts) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: infrastructure-${{ matrix.account }}
      cancel-in-progress: false
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.operation }}-${{ matrix.account }}-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Verify plan checksum
        working-directory: ${{ runner.temp }}/plan
        run: sha256sum --check reviewed.tfplan.sha256

      - name: Set up tooling and authenticate to AWS
        id: setup
        uses: ./.github/actions/setup-infrastructure
        with:
          target-account: ${{ matrix.account }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}
          role-session-name: gha-${{ github.run_id }}-${{ matrix.account }}-execute

      - name: Set selected image references
        if: inputs.operation == 'apply'
        id: ssm_update
        env:
          IMAGE_SHA: ${{ needs.validate-inputs.outputs.image_sha }}
          ACCOUNT_ALIAS: ${{ matrix.account }}
        run: bash scripts/infrastructure/image-parameters.sh set

      - name: Apply the exact reviewed binary plan
        working-directory: ${{ steps.setup.outputs.live_dir }}
        run: bash "$GITHUB_WORKSPACE/scripts/infrastructure/execute-plan.sh"

      - name: Restore prior SSM references after failed apply
        if: failure() && inputs.operation == 'apply' && steps.ssm_update.outcome != 'skipped'
        env:
          ACCOUNT_ALIAS: ${{ matrix.account }}
          IMAGE_SHA: ${{ needs.validate-inputs.outputs.image_sha }}
        run: bash scripts/infrastructure/restore-failed-apply.sh

      - name: Smoke-test deployed services
        if: inputs.operation == 'apply'
        working-directory: ${{ steps.setup.outputs.live_dir }}
        run: bash "$GITHUB_WORKSPACE/scripts/infrastructure/smoke-test.sh"

      - name: Summarize destruction
        if: inputs.operation == 'destroy'
        env:
          OPERATION: destroy-complete
          ACCOUNT_ALIAS: ${{ matrix.account }}
        run: bash scripts/infrastructure/summarize.sh
