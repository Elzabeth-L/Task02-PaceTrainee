name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to execute
        type: choice
        options: [plan, apply, destroy]
        required: true
      target_account:
        description: Target one account or all three
        type: choice
        options: [account-1, account-2, account-3, all]
        required: true
      image_sha:
        description: Optional image SHA override; blank uses latest successful main image build
        type: string
        required: false
      destroy_confirmation:
        description: Type DESTROY account-1/account-2/account-3/all for destroy
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  infrastructure:
    uses: ./.github/workflows/reusable-infrastructure.yml
    with:
      operation: ${{ inputs.operation }}
      target_account: ${{ inputs.target_account }}
      image_sha: ${{ inputs.image_sha }}
      destroy_confirmation: ${{ inputs.destroy_confirmation }}
