name: Set up infrastructure tooling and AWS
description: Selects an account, installs Terraform and Terragrunt, authenticates with OIDC, and verifies the AWS account.

inputs:
  target-account:
    description: Live account alias to select
    required: true
  terraform-version:
    description: Terraform version to install
    required: true
  terragrunt-version:
    description: Terragrunt version to install
    required: true
  role-session-name:
    description: AWS role session name
    required: true

outputs:
  live_dir:
    description: Terragrunt live directory for the selected account
    value: ${{ steps.account.outputs.live_dir }}

runs:
  using: composite
  steps:
    - name: Select account configuration
      id: account
      shell: bash
      env:
        TARGET_ACCOUNT: ${{ inputs.target-account }}
      run: bash "$GITHUB_WORKSPACE/scripts/infrastructure/select-account.sh"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Install Terragrunt
      shell: bash
      env:
        TERRAGRUNT_VERSION: ${{ inputs.terragrunt-version }}
      run: |
        bash "$GITHUB_WORKSPACE/scripts/install-terragrunt.sh" "$TERRAGRUNT_VERSION" "$RUNNER_TEMP/terragrunt"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Authenticate to selected AWS account with OIDC
      uses: aws-actions/configure-aws-credentials@v6.1.2
      with:
        role-to-assume: ${{ steps.account.outputs.role }}
        aws-region: ${{ steps.account.outputs.region }}
        role-session-name: ${{ inputs.role-session-name }}
        mask-aws-account-id: true

    - name: Verify AWS account identity
      shell: bash
      run: test "$(aws sts get-caller-identity --query Account --output text)" = "$TG_AWS_ACCOUNT_ID"
